name: Daily Stock & Prediction Auto Update

on:
  schedule:
    # UTC 07:10 = 한국 시간(KST) 평일 월~금 16:10 (장 마감 직후)
    - cron: '10 7 * * 1-5'
  workflow_dispatch: # 깃허브 웹에서 언제든 즉시 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 시세 크롤링, AI 예측 갱신 및 채점 실행
        run: |
          python update_daily.py

      - name: 갱신된 DB 및 데이터 자동 커밋 & 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add stock_data.db data/
          git diff --staged --quiet || (git commit -m "bot: 평일 장 마감 시세 자동 갱신 [$(date '+%Y-%m-%d')]" && git push origin main)
